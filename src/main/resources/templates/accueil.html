<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Memory Challenge - Accueil</title>
    <link rel="stylesheet" th:href="@{/images/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<h1>🧠 Memory Challenge</h1>

<div id="connexionDiv" class="connexion">
    <h2>👤 Connexion / Inscription</h2>

    <div class="form-group">
        <input type="text" id="pseudo" placeholder="Pseudo" style="padding:10px; border-radius:10px; width:200px;">
        <br>
        <input type="password" id="motDePasse" placeholder="Mot de passe" style="padding:10px; border-radius:10px; width:200px; margin-top:10px;">
    </div>

    <br>
    <button onclick="seConnecter()">🔐 Se connecter</button>
    <button onclick="sInscrire()">📝 S'inscrire</button>
</div>

<div id="menuJeu" style="display:none;">
    <h2>Bienvenue, <span id="pseudoAffichage"></span> ! 🎉</h2>
    <p>Prêt à tester ta mémoire ? Bonne chance !</p>

    <h3>Choisis ton niveau :</h3>
    <button onclick="demarrerPartie(1)">⭐ Facile</button><br>
    <button onclick="demarrerPartie(2)">⭐⭐ Moyen</button><br>
    <button onclick="demarrerPartie(3)">⭐⭐⭐ Difficile</button>

    <br><br>
    <button onclick="chargerPartieJoueur()">📂 Charger mes parties</button>
    <button onclick="window.location.href='/commentjouer'">❓ Comment jouer ?</button>
    <button onclick="seDeconnecter()">🚪 Se déconnecter</button>
</div>

<script>
    function seConnecter() {
        let pseudo = document.getElementById('pseudo').value.trim();
        let motDePasse = document.getElementById('motDePasse').value;

        if (!pseudo || !motDePasse) {
            alert('Remplis tous les champs');
            return;
        }

        fetch('/connexion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pseudo: pseudo, motDePasse: motDePasse })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('pseudoAffichage').innerText = pseudo;
                    document.getElementById('connexionDiv').style.display = 'none';
                    document.getElementById('menuJeu').style.display = 'block';
                } else {
                    alert('Erreur: ' + (data.message || 'Identifiants incorrects'));
                }
            });
    }

    function sInscrire() {
        let pseudo = document.getElementById('pseudo').value.trim();
        let motDePasse = document.getElementById('motDePasse').value;

        if (!pseudo || !motDePasse) {
            alert('Remplis tous les champs');
            return;
        }

        if (motDePasse.length < 4) {
            alert('Le mot de passe doit contenir au moins 4 caractères');
            return;
        }

        fetch('/inscription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pseudo: pseudo, motDePasse: motDePasse })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Inscription réussie ! Connecte-toi maintenant.');
                    document.getElementById('motDePasse').value = '';
                } else {
                    alert('Erreur: ' + data.message);
                }
            });
    }

    function seDeconnecter() {
        window.location.href = '/deconnexion';
    }

    function demarrerPartie(niveau) {
        window.location.href = '/nouvelle-partie?niveau=' + niveau;
    }

    function chargerPartieJoueur() {
        window.location.href = '/charger-partie';
    }

    // Vérifier si déjà connecté
    fetch('/verifier-session')
        .then(response => response.json())
        .then(data => {
            if (data.connecte) {
                document.getElementById('pseudo').value = data.joueur;
                document.getElementById('pseudoAffichage').innerText = data.joueur;
                document.getElementById('connexionDiv').style.display = 'none';
                document.getElementById('menuJeu').style.display = 'block';
            }
        });
</script>
</body>
</html>
